      <a class="tile" id="demo-01" href="p/demo-01.html">
        <picture>
          <source type="image/avif" sizes="(max-width: 599px) calc(100vw - 2rem), 440px"
            srcset="img/demo-01-400.avif 400w, img/demo-01-800.avif 800w, img/demo-01-1600.avif 1600w, img/demo-01-3200.avif 3200w">
          <source type="image/webp" sizes="(max-width: 599px) calc(100vw - 2rem), 440px"

          <img src="img/demo-01-800.jpg"

            srcset="img/demo-01-400.jpg 400w, img/demo-01-800.jpg 800w, img/demo-01-1600.jpg 1600w, img/demo-01-3200.jpg 3200w"
            width="800" height="533" loading="eager" fetchpriority="high" decoding="async"
            style="view-transition-name: photo-demo-01"
            alt="Pale grey light falling away to near-black across a soft horizontal band.">
        </picture>
      </a>
    </li>
